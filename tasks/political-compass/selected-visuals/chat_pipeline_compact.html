<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat Pipeline — Compact</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  body { margin:0; padding:24px; background:#fff; font-family:'Inter',system-ui,sans-serif; display:flex; justify-content:center; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <marker id="a-p" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="7" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/></marker>
    <marker id="a-b" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="7" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="a-a" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="7" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#d97706"/></marker>
    <marker id="a-e" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="7" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="sh" x="-2%" y="-4%" width="104%" height="110%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.07" flood-color="#000"/></filter>
  </defs>

  <!-- ===== TITLE ===== -->
  <text x="550" y="28" text-anchor="middle" font-size="20" font-weight="800" fill="#1e1b4b" letter-spacing="-0.03em">Chat Pipeline — Answer-then-Classify</text>

  <!-- ===== ROW 1: INVESTIGATING ===== -->
  <g transform="translate(0, 44)">
    <text x="22" y="14" font-size="11" font-weight="800" fill="#5b21b6" letter-spacing="0.05em">INVESTIGATING</text>
    <rect x="16" y="20" width="1068" height="54" rx="10" fill="#faf7ff" stroke="#c4b5fd" stroke-width="1.3"/>

    <!-- Model: 2-line -->
    <g transform="translate(22, 24)">
      <rect width="210" height="46" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#sh)"/>
      <text x="12" y="19" font-size="13" font-weight="700" fill="#5b21b6">Model</text>
      <rect x="58" y="6" width="28" height="16" rx="8" fill="#7c3aed"/><text x="72" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">8</text>
      <text x="12" y="37" font-size="10.5" fill="#6b7280">Gemma-3 · Qwen3</text>
    </g>
    <line x1="237" y1="47" x2="260" y2="47" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a-p)"/>

    <!-- Ideology -->
    <g transform="translate(264, 24)">
      <rect width="210" height="46" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#sh)"/>
      <text x="12" y="19" font-size="13" font-weight="700" fill="#5b21b6">Ideology</text>
      <rect x="78" y="6" width="24" height="16" rx="8" fill="#7c3aed"/><text x="90" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">6</text>
      <text x="12" y="37" font-size="10.5" fill="#6b7280">Base + 5 Steered Personas</text>
    </g>
    <line x1="479" y1="47" x2="502" y2="47" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a-p)"/>

    <!-- Quantization -->
    <g transform="translate(506, 24)">
      <rect width="190" height="46" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#sh)"/>
      <text x="12" y="19" font-size="13" font-weight="700" fill="#5b21b6">Quantization</text>
      <rect x="110" y="6" width="24" height="16" rx="8" fill="#7c3aed"/><text x="122" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">1</text>
      <text x="12" y="37" font-size="10.5" fill="#6b7280">Native only · Non-zero sampling</text>
    </g>
    <line x1="701" y1="47" x2="724" y2="47" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a-p)"/>

    <!-- 62 Questions -->
    <g transform="translate(728, 24)">
      <rect width="350" height="46" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#sh)"/>
      <text x="12" y="19" font-size="13" font-weight="700" fill="#5b21b6">62 Questions</text>
      <text x="12" y="37" font-size="10.5" fill="#6b7280">Political Compass Test</text>
    </g>
  </g>

  <!-- ===== ARROW DOWN ===== -->
  <line x1="550" y1="118" x2="550" y2="134" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#a-b)"/>

  <!-- ===== ROW 2: LHS (label + badge only) ===== -->
  <g transform="translate(0, 140)">
    <text x="22" y="14" font-size="11" font-weight="800" fill="#1d4ed8" letter-spacing="0.05em">LHS</text>
    <text x="48" y="14" font-size="11" fill="#3b82f6" font-weight="600">9 Dimensions · 300 Samples per block</text>
    <rect x="16" y="20" width="888" height="42" rx="10" fill="#f8fbff" stroke="#93c5fd" stroke-width="1.3"/>

    <g transform="translate(22, 24)">
      <rect width="110" height="34" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" filter="url(#sh)"/>
      <text x="12" y="23" font-size="12" font-weight="700" fill="#1e40af">Language</text>
      <rect x="80" y="7" width="22" height="16" rx="8" fill="#2563eb"/><text x="91" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">1</text>
    </g>

    <g transform="translate(144, 24)">
      <rect width="110" height="34" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" filter="url(#sh)"/>
      <text x="12" y="23" font-size="12" font-weight="700" fill="#1e40af">Framing</text>
      <rect x="80" y="7" width="22" height="16" rx="8" fill="#2563eb"/><text x="91" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">6</text>
    </g>

    <g transform="translate(266, 24)">
      <rect width="140" height="34" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" filter="url(#sh)"/>
      <text x="12" y="23" font-size="12" font-weight="700" fill="#1e40af">Instruction</text>
      <rect x="96" y="7" width="36" height="16" rx="8" fill="#2563eb"/><text x="114" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">2×5×3</text>
    </g>

    <g transform="translate(418, 24)">
      <rect width="120" height="34" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#sh)"/>
      <text x="12" y="23" font-size="12" font-weight="700" fill="#1e40af">Persona</text>
      <rect x="80" y="7" width="32" height="16" rx="8" fill="#2563eb"/><text x="96" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">2×5</text>
    </g>

    <g transform="translate(550, 24)">
      <rect width="160" height="34" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" filter="url(#sh)"/>
      <text x="12" y="23" font-size="12" font-weight="700" fill="#1e40af">Answer Format</text>
      <rect x="120" y="7" width="32" height="16" rx="8" fill="#2563eb"/><text x="136" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">4×4</text>
    </g>

    <!-- Answer Suffix — NEW, teal -->
    <g transform="translate(722, 24)">
      <rect width="170" height="34" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/>
      <text x="12" y="23" font-size="12" font-weight="700" fill="#0d9488">Answer Suffix</text>
      <rect x="108" y="7" width="28" height="16" rx="8" fill="#0d9488"/><text x="122" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">NEW</text>
      <rect x="140" y="7" width="22" height="16" rx="8" fill="#0d9488"/><text x="151" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">5</text>
    </g>

    <text x="930" y="46" font-size="10" fill="#93c5fd" font-weight="500">≤ 144,000 → 300</text>
  </g>

  <!-- ===== ARROW DOWN ===== -->
  <line x1="550" y1="202" x2="550" y2="218" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#a-a)"/>

  <!-- ===== ROW 3: STAGE 1 — GENERATE ANSWER ===== -->
  <g transform="translate(0, 224)">
    <text x="22" y="14" font-size="11" font-weight="800" fill="#92400e" letter-spacing="0.05em">STAGE 1 — GENERATE ANSWER</text>

    <!-- Left: stacked compact label-only blocks -->
    <g transform="translate(22, 26)">
      <rect width="170" height="30" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="30" rx="3 0 0 3" fill="#f59e0b"/>
      <text x="92" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Context Block</text>
    </g>
    <text x="107" y="69" text-anchor="middle" font-size="11" fill="#d97706" font-weight="600">+</text>
    <g transform="translate(22, 72)">
      <rect width="170" height="30" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5 3"/>
      <rect x="0" y="0" width="5" height="30" rx="3 0 0 3" fill="#fbbf24"/>
      <text x="92" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Persona Block</text>
    </g>
    <text x="107" y="115" text-anchor="middle" font-size="11" fill="#d97706" font-weight="600">+</text>
    <g transform="translate(22, 118)">
      <rect width="170" height="30" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="30" rx="3 0 0 3" fill="#f59e0b"/>
      <text x="92" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Instruction + Question</text>
    </g>

    <!-- Arrow to example -->
    <line x1="198" y1="96" x2="230" y2="96" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-a)"/>

    <!-- Right: Stage-1 output example -->
    <g transform="translate(234, 0)">
      <rect width="844" height="188" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#sh)"/>
      <rect x="0" y="0" width="844" height="24" rx="10 10 0 0" fill="#fef3c7"/>
      <text x="422" y="17" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">Stage-1: LLM generates a natural-language response (reasoning mode: short · neutral · think)</text>

      <text x="18" y="48" font-size="13" fill="#44403c" font-family="'Courier New',monospace">The statement suggests that economic globalisation should serve</text>
      <text x="18" y="66" font-size="13" fill="#44403c" font-family="'Courier New',monospace">the interests of all people, not just corporations.</text>

      <text x="18" y="90" font-size="13" fill="#44403c" font-family="'Courier New',monospace">I agree with this perspective because globalisation has often</text>
      <text x="18" y="108" font-size="13" fill="#44403c" font-family="'Courier New',monospace">benefited large multinational corporations at the expense of</text>
      <text x="18" y="126" font-size="13" fill="#44403c" font-family="'Courier New',monospace">local communities and workers. Therefore, policies that ensure</text>
      <text x="18" y="144" font-size="13" fill="#44403c" font-family="'Courier New',monospace">a more equitable distribution of the benefits would be welcome.</text>

      <text x="18" y="170" font-size="13" fill="#0d9488" font-family="'Courier New',monospace" font-weight="700">+ Suffix: "Final answer key:"</text>
      <text x="318" y="170" font-size="12" fill="#78716c" font-family="'Courier New',monospace" font-style="italic">(one of 5 extraction cue phrasings)</text>

      <rect x="720" y="156" width="100" height="24" rx="6" fill="#059669"/>
      <text x="770" y="173" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">Next Token →</text>
    </g>
  </g>

  <!-- ===== ARROW DOWN ===== -->
  <line x1="550" y1="430" x2="550" y2="448" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#a-e)"/>

  <!-- ===== ROW 4: CLASSIFY (single statement) ===== -->
  <g transform="translate(22, 456)">
    <rect x="0" y="0" width="1056" height="40" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#sh)"/>
    <text x="14" y="16" font-size="11" font-weight="800" fill="#065f46" letter-spacing="0.05em">CLASSIFY</text>
    <text x="84" y="16" font-size="12.5" fill="#065f46" font-weight="600">Score candidate keys via prompt logprobs</text>
    <text x="374" y="16" font-size="12.5" fill="#6b7280">→ extract logits for {A,B,C,D}</text>
    <text x="604" y="16" font-size="12.5" fill="#6b7280">→ softmax →</text>
    <text x="706" y="16" font-size="12.5" font-weight="700" fill="#065f46">P(option)</text>
    <text x="14" y="33" font-size="10" fill="#9ca3af">No new generation — deterministic classification of the model's own Stage-1 reasoning</text>
  </g>

  <!-- ===== Δ from MCQ ===== -->
  <g transform="translate(22, 510)">
    <rect x="0" y="0" width="1056" height="30" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="14" y="20" font-size="11" font-weight="800" fill="#5b21b6">Δ from MCQ:</text>
    <text x="108" y="20" font-size="11" fill="#6b7280">Two-stage (generate → classify)</text>
    <text x="332" y="20" font-size="11" fill="#6b7280">· Reasoning modes (short / neutral / think)</text>
    <text x="618" y="20" font-size="11" fill="#6b7280">· Answer Suffix (5 cues)</text>
    <text x="790" y="20" font-size="11" fill="#6b7280">· English only · Single quant</text>
  </g>

  <text x="1078" y="616" text-anchor="end" font-size="9" fill="#cbd5e1">LHS seed=42, reused across all blocks</text>
</svg>
</body>
</html>
